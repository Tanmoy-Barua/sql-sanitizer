name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm test
      - name: Run concat scanner (exit 2 = findings found, still OK)
        run: |
          set +e
          node bin/sql-sanitizer.js scan . --json > /tmp/scan.json
          code=$?
          set -e
          # 0 = clean, 2 = findings; anything else is a crash
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            exit "$code"
          fi
          test -s /tmp/scan.json
